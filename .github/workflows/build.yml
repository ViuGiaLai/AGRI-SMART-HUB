name: Build Windows EXE
 
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build EXE
      run: |
        pyinstaller --onefile --windowed --name AgriSmartHub main.py

    - name: Upload EXE
      uses: softprops/action-gh-release@v2
      with:
        files: dist/AgriSmartHub.exe
